<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say's</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>Simon Game</h1>
    <h3 style="text-align:left"></h3>
    <h2>Press any key to start the game</h2>
    <div class="box-container">
        <div>
            <div type="button" class="box red" id="red">1</div>
            <div type="button" id="yellow" class="box yellow">2</div>
        </div>
        <div>
            <div type="button" id="green" class="box green">3</div>
            <div type="button" id="purple" class="box purple">4</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
